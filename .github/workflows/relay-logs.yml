name: relay-logs
# Последние логи функции bred-relay (для отладки). Перезапуск: gh run rerun <id>
on:
  push:
    branches: [claude/lucid-morse-20daf0]
    paths: [.github/workflows/relay-logs.yml]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      YC_SA_ID: aje066l1cifojvc839sd
    steps:
      - name: Get IAM token via workload identity federation
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('https://github.com/ZyablikTM');
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
              requested_token_type: 'urn:ietf:params:oauth:token-type:access_token',
              audience: process.env.YC_SA_ID,
              subject_token: idToken,
              subject_token_type: 'urn:ietf:params:oauth:token-type:id_token'
            });
            const res = await fetch('https://auth.yandex.cloud/oauth/token', { method: 'POST', body });
            const json = await res.json();
            if (!json.access_token) { core.setFailed(`token exchange failed: HTTP ${res.status}`); return; }
            core.setSecret(json.access_token);
            core.exportVariable('YC_IAM_TOKEN', json.access_token);
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Logs
        run: |
          yc config profile create default >/dev/null
          yc config set endpoint api.cloud.yandex.net:443
          F=$(yc iam service-account get --id "$YC_SA_ID" --format json --token "$YC_IAM_TOKEN" | jq -r .folder_id)
          echo "== function logs"
          yc serverless function logs --name bred-relay --folder-id "$F" --group-name bred-logs --since 30m --limit 200 --token "$YC_IAM_TOKEN" | tail -120
          echo "== gateway logs"
          GW=$(yc serverless api-gateway get --name bred-relay-gw --folder-id "$F" --format json --token "$YC_IAM_TOKEN" | jq -r .log_options.log_group_id)
          yc logging read --group-name bred-logs --folder-id "$F" --since 30m --limit 60 --resource-types serverless.apigateway --token "$YC_IAM_TOKEN" | tail -60 || true
