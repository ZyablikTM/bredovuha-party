name: deploy-relay
# Разворачивает сервер-пересыльщик в Yandex Cloud.
# Вход без ключей: GitHub выдаёт OIDC-токен, Яндекс меняет его на IAM-токен
# сервисного аккаунта github-deploy через федерацию сервисных аккаунтов.
on:
  push:
    branches: [main, claude/lucid-morse-20daf0]
    paths: [server/**, .github/workflows/deploy-relay.yml]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YC_SA_ID: aje066l1cifojvc839sd
    steps:
      - uses: actions/checkout@v4
      - name: Get IAM token via workload identity federation
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('https://github.com/ZyablikTM');
            const body = new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:token-exchange',
              requested_token_type: 'urn:ietf:params:oauth:token-type:access_token',
              audience: process.env.YC_SA_ID,
              subject_token: idToken,
              subject_token_type: 'urn:ietf:params:oauth:token-type:id_token'
            });
            const res = await fetch('https://auth.yandex.cloud/oauth/token', { method: 'POST', body });
            const json = await res.json();
            if (!json.access_token) {
              core.setFailed(`token exchange failed: HTTP ${res.status} ${json.error || ''} ${json.error_description || ''}`);
              return;
            }
            core.setSecret(json.access_token);
            core.exportVariable('YC_IAM_TOKEN', json.access_token);
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
      - name: Deploy
        run: bash server/deploy.sh
